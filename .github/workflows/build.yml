name: Build Docker

on:
  pull_request:
    branches:
      - 'Desarrollo_productivo'
      - 'dependencies'
# Para testing con Act
#on:
#  push:
#    branches:
#      - 'Desarrollo_productivo'

env:
  TEST_TAG: user/app:latest

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            API_DIGITALIZADO_URL=http://build.image.net/api/api-1,
            API_CONFIGURADOR_URL=http://build.image.net/api/api-2,
            API_VENTAS_URL=http://build.image.net/api/api-3,
            COOKIE_DOMAIN=image.net
